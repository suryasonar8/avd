# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-04"

[[extensions]]
name = "checkout-terms"
handle = "checkout-terms"
type = "ui_extension"
uid = "a1c4e6f2-3b5d-4a9e-8f1c-6d2b9e7a5c30"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
# Gives your extension access to directly query Shopify’s storefront API.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#api-access
api_access = true

# Loads the app-owned metafield holding status/trigger condition (set from
# this app's own admin — plan-gated). The checkbox's message text/color/
# keyword/link/error live in [extensions.settings] below instead, edited
# natively in the Checkout Editor, not synced from this app's DB.
[[extensions.metafields]]
namespace = "$app:avd"
key = "checkout_terms_conditions"

# Defines settings collected from merchants in the Checkout Editor. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#settings-definition
[extensions.settings]
  [[extensions.settings.fields]]
  key = "message"
  type = "single_line_text_field"
  name = "Message"
  description = "The text shown next to the checkbox"

  [[extensions.settings.fields]]
  key = "message_color"
  type = "single_line_text_field"
  name = "Message color"
  description = "Tone of the message banner"

    [[extensions.settings.fields.validations]]
    name = "choices"
    value = '["info","warning","success","critical"]'

  [[extensions.settings.fields]]
  key = "keyword"
  type = "single_line_text_field"
  name = "Keyword"
  description = "Word or phrase inside the message to hyperlink (optional)"

  [[extensions.settings.fields]]
  key = "link"
  type = "single_line_text_field"
  name = "Link to keyword"
  description = "URL the keyword links to (optional)"

  [[extensions.settings.fields]]
  key = "error_message"
  type = "single_line_text_field"
  name = "Error message"
  description = "Shown when the buyer tries to continue without checking the box"
